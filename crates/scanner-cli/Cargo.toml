[package]
name = "scanner-cli"
description = "Command-line front end for scanner-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "scanner"
path = "src/main.rs"

[dependencies]
scanner-core.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
serde = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
