# Builds the packages for every system. Run by hand (Actions → Release → Run
# workflow) to get them as build artifacts; pushing a tag such as v0.2.0 also
# puts them into a draft GitHub release, which stays private until published.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Only the release job may write; the builds, which hold the signing secrets
# and run third-party actions, can only read.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          # The oldest supported Ubuntu: an AppImage built there runs on newer systems too.
          - os: ubuntu-22.04
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # macOS: one app for Apple Silicon and Intel.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install UI dependencies
        run: npm --prefix app ci

      # The exe and the portable zip, signed when the signing secrets are set
      # (see app/scripts/sign.ps1).
      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          DISKSCANNER_SIGN_PFX_BASE64: ${{ secrets.DISKSCANNER_SIGN_PFX_BASE64 }}
          DISKSCANNER_SIGN_PFX_PASSWORD: ${{ secrets.DISKSCANNER_SIGN_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if ($env:DISKSCANNER_SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:DISKSCANNER_SIGN_PFX_BASE64))
            $env:DISKSCANNER_SIGN_PFX = $pfx
          }
          npm --prefix app run release
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist-release/* out/

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          npm --prefix app run tauri -- build --bundles appimage,deb
          mkdir -p out
          cp target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb out/

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          npm --prefix app run tauri -- build --target universal-apple-darwin --bundles dmg
          mkdir -p out
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg out/

      - uses: actions/upload-artifact@v4
        with:
          name: disk-scanner-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Disk Scanner ${GITHUB_REF_NAME#v}"
